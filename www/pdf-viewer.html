<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PDF</title>
<style>
  :root{
    --bg:#0A0F1E; --bar:#121A35; --line:rgba(255,255,255,.1); --ink:#F4F6FB; --soft:#8D97B8; --faint:#5C6684;
    --violet:#7C5CFA; --cyan:#22C7D8; --green:#3DDC91; --red:#FF6B6B;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:var(--sans); overflow:hidden;}
  [hidden]{display:none !important;}
  button{font-family:var(--sans); color:inherit;}
  svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none;}

  #app{position:fixed; inset:0; display:flex; flex-direction:column;}

  /* ---- top bar ---- */
  .bar{
    flex:none; display:flex; align-items:center; gap:4px; padding:8px 8px 8px 6px;
    padding-top:calc(8px + env(safe-area-inset-top)); background:var(--bar); border-bottom:1px solid var(--line); z-index:20;
  }
  .ib{width:42px; height:42px; border:none; background:none; border-radius:12px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .ib:active{background:rgba(255,255,255,.1);}
  .ttl{flex:1; min-width:0; font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 4px;}
  .pg{
    flex:none; border:1px solid var(--line); background:rgba(255,255,255,.06); border-radius:999px;
    font-size:12.5px; font-weight:700; padding:7px 12px; margin-right:2px; cursor:pointer; white-space:nowrap;
  }
  .savebtn{
    flex:none; border:none; border-radius:999px; background:#A9B8FF; color:#0E1530; font-weight:700; font-size:14px;
    padding:10px 20px; margin-right:2px; cursor:pointer;
  }

  /* ---- search ---- */
  .searchbar{flex:none; display:flex; align-items:center; gap:6px; padding:8px 10px; background:var(--bar); border-bottom:1px solid var(--line); z-index:19;}
  .searchbar input{
    flex:1; min-width:0; background:rgba(255,255,255,.07); border:1px solid var(--line); border-radius:12px; color:var(--ink);
    font-size:15px; padding:10px 12px; outline:none; font-family:var(--sans);
  }
  .searchbar .cnt{font-size:12px; color:var(--soft); min-width:54px; text-align:center; white-space:nowrap;}
  .searchbar .ib{width:38px; height:38px;}

  /* ---- scroller / pages ---- */
  #scroller{flex:1; position:relative; overflow:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-x pan-y; background:#080C18;}
  #pages{width:max-content; min-width:100%; padding:10px 8px 150px; transform-origin:0 0;}
  .page{position:relative; margin:0 auto 10px; background:#fff; box-shadow:0 2px 14px rgba(0,0,0,.45); overflow:hidden;}
  .page canvas{position:absolute; left:0; top:0; width:100%; height:100%; display:block;}
  .page .hlc{mix-blend-mode:multiply; pointer-events:none;}
  .page .penc{pointer-events:none;}
  .page .tl{position:absolute; inset:0; overflow:hidden; line-height:1; z-index:2;}
  .page .tl span{position:absolute; white-space:pre; color:transparent; transform-origin:0 0; cursor:text;}
  .page .tl span::selection{background:rgba(70,120,255,.35); color:transparent;}
  .page .hll{position:absolute; inset:0; pointer-events:none; z-index:1;}
  .page .hlr{position:absolute; background:rgba(255,214,0,.45); border-radius:2px; mix-blend-mode:multiply;}
  .page .hlr.cur{background:rgba(255,120,0,.6);}
  .page .ov{position:absolute; inset:0; z-index:3; pointer-events:none;}
  body.annotating .page .ov{pointer-events:auto; touch-action:none;}
  body.annotating .page .tl{pointer-events:none;}
  .annhidden .hlc, .annhidden .penc{display:none;}
  body.night .page{background:#101010;}
  body.night .page .pdfc{filter:invert(1) hue-rotate(180deg);}
  body.night .page .hlc{mix-blend-mode:screen;}
  body.night .page .hlr{mix-blend-mode:screen;}
  .msg{position:absolute; left:0; right:0; top:90px; text-align:center; color:var(--soft); font-size:14.5px; line-height:1.7; padding:0 24px; pointer-events:none;}

  /* ---- floating controls ---- */
  .fab{
    position:fixed; right:16px; bottom:calc(20px + env(safe-area-inset-bottom)); width:56px; height:56px; border-radius:18px; border:none;
    background:linear-gradient(135deg,var(--violet),#5A3DE0); color:#fff; display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 24px -8px rgba(90,61,224,.8); z-index:15; cursor:pointer;
  }
  .pgnav{position:fixed; right:16px; bottom:calc(90px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; z-index:15;
    background:rgba(18,26,53,.92); border:1px solid var(--line); border-radius:999px; overflow:hidden;}
  .pgnav button{width:44px; height:42px; border:none; background:none; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .pgnav button:active{background:rgba(255,255,255,.12);}

  .tools{
    position:fixed; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom)); z-index:25;
    display:flex; align-items:center; gap:2px; padding:8px 10px; max-width:calc(100vw - 16px);
    background:#1C2447; border:1px solid rgba(255,255,255,.14); border-radius:999px; box-shadow:0 14px 34px rgba(0,0,0,.55);
  }
  .tools .tb{position:relative; width:46px; height:46px; border:none; background:none; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#C9D2F5;}
  .tools .tb.on{background:#33407A; color:#fff;}
  .tools .tb:disabled{opacity:.3;}
  .tools .tb i{position:absolute; left:11px; right:11px; bottom:5px; height:4px; border-radius:3px; background:currentColor;}
  .tools .sep{width:1px; height:26px; background:var(--line); margin:0 4px;}

  .pop{
    position:fixed; left:50%; transform:translateX(-50%); bottom:calc(86px + env(safe-area-inset-bottom)); z-index:26; width:min(86vw,320px);
    background:#1C2447; border:1px solid rgba(255,255,255,.14); border-radius:18px; padding:14px 16px; box-shadow:0 14px 34px rgba(0,0,0,.55);
  }
  .pop h4{margin:0 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--soft);}
  .swatches{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  .sw{width:34px; height:34px; border-radius:50%; border:3px solid transparent; cursor:pointer; padding:0;}
  .sw.on{border-color:#fff;}
  .pop input[type=range]{width:100%; accent-color:#9DB0FF;}
  .pop .prev{height:34px; display:flex; align-items:center; justify-content:center;}
  .pop .prev span{display:block; border-radius:99px; width:70%;}

  .scrim{position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.45);}
  .menu{
    position:fixed; right:8px; top:calc(56px + env(safe-area-inset-top)); z-index:31; width:min(78vw,280px);
    background:#1A2244; border:1px solid rgba(255,255,255,.14); border-radius:16px; padding:6px; box-shadow:0 18px 40px rgba(0,0,0,.6);
  }
  .menu button{
    width:100%; display:flex; align-items:center; gap:14px; text-align:left; background:none; border:none; border-radius:11px;
    padding:12px 12px; font-size:14.5px; font-weight:600; cursor:pointer;
  }
  .menu button:active{background:rgba(255,255,255,.1);}
  .menu button svg{width:19px; height:19px; color:var(--soft);}
  .menu button .tag{margin-left:auto; font-size:12px; color:var(--soft);}
  .menu button.danger{color:var(--red);} .menu button.danger svg{color:var(--red);}
  .menu hr{border:none; border-top:1px solid var(--line); margin:4px 6px;}

  .modal{position:fixed; left:50%; top:30%; transform:translateX(-50%); z-index:32; width:min(86vw,320px); background:#1A2244; border:1px solid rgba(255,255,255,.14); border-radius:18px; padding:18px;}
  .modal h3{margin:0 0 12px; font-size:16px;}
  .modal input{width:100%; background:rgba(255,255,255,.07); border:1px solid var(--line); border-radius:12px; color:var(--ink); font-size:18px; padding:12px; outline:none; font-family:var(--sans);}
  .modal .row{display:flex; gap:10px; margin-top:14px;}
  .modal .row button{flex:1; padding:12px; border-radius:12px; border:1px solid var(--line); background:rgba(255,255,255,.06); font-weight:700; font-size:14px; cursor:pointer;}
  .modal .row button.go{background:linear-gradient(135deg,var(--violet),#5A3DE0); border-color:transparent; color:#fff;}
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:32; max-height:60vh; overflow:auto; background:#1A2244; border-top:1px solid rgba(255,255,255,.14); border-radius:22px 22px 0 0; padding:16px 16px calc(20px + env(safe-area-inset-bottom));}
  .sheet h3{margin:0 0 12px; font-size:16px;}
  .bm{display:flex; align-items:center; gap:10px; padding:12px 6px; border-bottom:1px solid var(--line); font-size:15px; font-weight:600;}
  .bm .go{flex:1; background:none; border:none; text-align:left; font-size:15px; font-weight:600; cursor:pointer; padding:4px 0;}
  .bm .rm{background:none; border:none; color:var(--red); font-size:13px; cursor:pointer;}
  .empty{color:var(--soft); font-size:14px; padding:10px 4px;}

  .toast{position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px); opacity:0; z-index:40;
    background:#0F1530; border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:10px 18px; font-size:13.5px; font-weight:600; pointer-events:none; transition:all .22s ease; white-space:nowrap;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <button class="ib" id="backBtn" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <div class="ttl" id="ttl">PDF</div>
    <button class="savebtn" id="saveBtn" hidden>Save</button>
    <button class="pg" id="pgInd" aria-label="Go to page">&ndash; / &ndash;</button>
    <button class="ib" id="searchBtn" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
    <button class="ib" id="menuBtn" aria-label="More"><svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
  </header>

  <div class="searchbar" id="searchbar" hidden>
    <input id="q" type="search" placeholder="Search in document" enterkeyhint="search" autocomplete="off">
    <span class="cnt" id="qCount"></span>
    <button class="ib" id="qPrev" aria-label="Previous match"><svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg></button>
    <button class="ib" id="qNext" aria-label="Next match"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <button class="ib" id="qClose" aria-label="Close search"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>

  <div id="scroller">
    <div id="pages"></div>
    <div class="msg" id="msg">Loading&hellip;</div>
  </div>
</div>

<div class="pgnav" id="pgnav">
  <button id="pgUp" aria-label="Previous page"><svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg></button>
  <button id="pgDown" aria-label="Next page"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
</div>

<button class="fab" id="fab" aria-label="Annotate"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>

<div class="tools" id="tools" hidden>
  <button class="tb on" id="tPen" aria-label="Pen"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><i id="tPenC"></i></button>
  <button class="tb" id="tHl" aria-label="Highlighter"><svg viewBox="0 0 24 24"><path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg><i id="tHlC"></i></button>
  <button class="tb" id="tEr" aria-label="Eraser"><svg viewBox="0 0 24 24"><path d="M20 20H9L4 15a2 2 0 0 1 0-2.8l8.4-8.4a2 2 0 0 1 2.8 0l5 5a2 2 0 0 1 0 2.8L12 20"/><path d="M7 11l6 6"/></svg></button>
  <span class="sep"></span>
  <button class="tb" id="tUndo" aria-label="Undo" disabled><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <button class="tb" id="tRedo" aria-label="Redo" disabled><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  <span class="sep"></span>
  <button class="tb" id="tEye" aria-label="Show or hide annotations"><svg viewBox="0 0 24 24" id="eyeSvg"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
</div>

<div class="pop" id="optPop" hidden>
  <h4 id="popTitle">Pen</h4>
  <div class="swatches" id="swatches"></div>
  <h4>Thickness</h4>
  <input type="range" id="sizeRange" min="1" max="10" step="1">
  <div class="prev"><span id="prevLine"></span></div>
</div>

<div class="scrim" id="scrim" hidden></div>

<div class="menu" id="menu" hidden>
  <button id="mNight"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Night mode<span class="tag" id="nightTag">Off</span></button>
  <button id="mFit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Fit to width</button>
  <button id="mZin"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35M11 8v6M8 11h6"/></svg>Zoom in</button>
  <button id="mZout"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35M8 11h6"/></svg>Zoom out</button>
  <hr>
  <button id="mGoto"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>Go to page&hellip;</button>
  <button id="mBm"><svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><span id="bmLabel">Bookmark this page</span></button>
  <button id="mBmList"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Bookmarks<span class="tag" id="bmCount">0</span></button>
  <hr>
  <button id="mAnnVis"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><span id="annVisLabel">Hide annotations</span></button>
  <button id="mClear" class="danger"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>Clear all annotations</button>
</div>

<div class="modal" id="gotoModal" hidden>
  <h3>Go to page</h3>
  <input id="gotoInput" type="number" inputmode="numeric" min="1" placeholder="Page number">
  <div class="row"><button id="gotoCancel">Cancel</button><button class="go" id="gotoGo">Go</button></div>
</div>

<div class="sheet" id="bmSheet" hidden>
  <h3>Bookmarks</h3>
  <div id="bmList"></div>
</div>

<div class="toast" id="toast"></div>

<script src="pdfjs/pdf.min.js"></script>
<script>
(function(){
'use strict';

var $ = function(id){ return document.getElementById(id); };
var qs = new URLSearchParams(location.search);
var file = qs.get('f');
var title = qs.get('t') || 'PDF';
$('ttl').textContent = title;
var FK = encodeURIComponent(file || '');

/* ---------------- storage helpers ---------------- */
function lsGet(k, d){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
var K_ANN = 'vpair_ann_' + FK, K_BM = 'vpair_bm_' + FK, K_POS = 'vpair_pos_' + FK, K_NIGHT = 'vpair_night';

/* ---------------- state ---------------- */
var pdf = null, N = 0, pages = [];
var scroller = $('scroller'), pagesEl = $('pages');
var zoom = 1, MIN_Z = 0.6, MAX_Z = 5, baseW = 0;
var annotating = false, annVisible = true, tool = 'pen';
var COLORS = {
  pen: ['#E53935', '#1E88E5', '#43A047', '#212121', '#FB8C00', '#8E24AA'],
  hl:  ['#FFEB3B', '#9CFF57', '#FF80AB', '#4DD0E1', '#FFAB40', '#B388FF']
};
var cfg = { pen: { c: COLORS.pen[0], s: 3 }, hl: { c: COLORS.hl[0], s: 18 } };
var ann = {};                       // page number -> [stroke]
var undoSt = [], redoSt = [];
var searchToken = 0, matches = [], curMatch = -1, query = '';
var bookmarks = lsGet(K_BM, []);

function toast(msg){
  var t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(function(){ t.classList.remove('show'); }, 1700);
}

/* ---------------- back button / layers ---------------- */
var layers = [];
function pushLayer(name, close){ layers.push({ name: name, close: close }); try { history.pushState({ vpl: name }, ''); } catch(e){} }
function closeLayer(name){
  if(!layers.length) return;
  if(layers[layers.length - 1].name === name){ history.back(); }
  else { for(var i = layers.length - 1; i >= 0; i--){ if(layers[i].name === name){ var l = layers.splice(i, 1)[0]; l.close(); break; } } }
}
window.addEventListener('popstate', function(){ var l = layers.pop(); if(l) l.close(); });
$('backBtn').onclick = function(){
  if(history.length > 1) history.go(-(layers.length + 1)); else location.href = 'index.html';
};

/* ---------------- loading ---------------- */
function boot(tries){
  if(!file){ $('msg').textContent = 'Could not open this file.'; return; }
  if(!window.pdfjsLib){
    if(tries > 60){ $('msg').textContent = 'PDF engine did not load.'; return; }
    return setTimeout(function(){ boot(tries + 1); }, 100);
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdfjs/pdf.worker.min.js';
  var task = pdfjsLib.getDocument({ url: file, cMapUrl: 'pdfjs/cmaps/', cMapPacked: true, standardFontDataUrl: 'pdfjs/standard_fonts/' });
  task.onProgress = function(p){ if(p && p.total) $('msg').textContent = 'Loading… ' + Math.round(p.loaded / p.total * 100) + '%'; };
  task.promise.then(async function(doc){
    pdf = doc; N = doc.numPages;
    for(var i = 1; i <= N; i++){
      var pg = await doc.getPage(i);
      var vp = pg.getViewport({ scale: 1 });
      pages.push({ n: i, page: pg, pw: vp.width, ph: vp.height, rv: 0, rendered: false, hasCanvas: false, task: null, items: null, textP: null, geo: null });
    }
    ann = (lsGet(K_ANN, { pages: {} }).pages) || {};
    buildPages();
    $('msg').style.display = 'none';
    restorePosition();
    updateBookmarkUI();
    try { renderVisible(); } catch(e){}
    updateIndicator();
  }).catch(function(err){
    $('msg').textContent = 'This file could not be opened. (' + (err && err.message ? err.message : err) + ')';
  });
}

function buildPages(){
  var frag = document.createDocumentFragment();
  pages.forEach(function(p){
    var el = document.createElement('div'); el.className = 'page'; el.dataset.n = p.n;
    p.pdfc = mk('canvas', 'pdfc'); p.hlc = mk('canvas', 'hlc'); p.penc = mk('canvas', 'penc');
    p.hll = mk('div', 'hll'); p.tl = mk('div', 'tl'); p.ov = mk('div', 'ov');
    [p.pdfc, p.hlc, p.penc, p.hll, p.tl, p.ov].forEach(function(c){ el.appendChild(c); });
    p.el = el; frag.appendChild(el);
    attachDraw(p);
  });
  pagesEl.appendChild(frag);
  layoutPages();
}
function mk(tag, cls){ var e = document.createElement(tag); e.className = cls; return e; }

function layoutPages(){
  baseW = Math.min(scroller.clientWidth - 16, 1100);
  pages.forEach(function(p){
    var w = baseW * zoom, h = w * p.ph / p.pw;
    p.cw = w; p.chh = h;
    p.el.style.width = w + 'px'; p.el.style.height = h + 'px';
  });
}

/* ---------------- rendering ---------------- */
function renderVisible(){
  if(!pages.length) return;
  var vh = scroller.clientHeight, m = vh * 1.2, st = scroller.scrollTop;
  for(var i = 0; i < pages.length; i++){
    var p = pages[i], top = p.el.offsetTop - st, bot = top + p.chh;
    var vis = bot > -m && top < vh + m;
    if(vis && !p.rendered) renderPage(p);
    else if(!vis && (p.rendered || p.hasCanvas)) releasePage(p);
  }
}

function renderPage(p){
  p.rendered = true; var rv = ++p.rv;
  if(p.task){ try { p.task.cancel(); } catch(e){} }
  var dpr = Math.min(window.devicePixelRatio || 1, 3);
  var f = Math.min(dpr, Math.sqrt(16e6 / (p.cw * p.chh)));
  f = Math.max(f, 0.5);
  var vp = p.page.getViewport({ scale: (p.cw / p.pw) * f });
  var tmp = document.createElement('canvas');
  tmp.width = Math.floor(vp.width); tmp.height = Math.floor(vp.height);
  try { p.task = p.page.render({ canvasContext: tmp.getContext('2d'), viewport: vp }); } catch(err){ p.rendered = false; return; }

function menuThen(fn){ return function(){ closeLayer('menu'); setTimeout(fn, 60); }; }

function setNight(v){
  document.body.classList.toggle('night', v); $('nightTag').textContent = v ? 'On' : 'Off'; lsSet(K_NIGHT, v);
}
setNight(!!lsGet(K_NIGHT, false));
$('mNight').onclick = function(){ setNight(!document.body.classList.contains('night')); closeLayer('menu'); };
$('mFit').onclick = menuThen(function(){ var n = curPage(); applyZoom(1); scrollToPage(n, 0); });
$('mZin').onclick = function(){ applyZoom(zoom * 1.35); };
$('mZout').onclick = function(){ applyZoom(zoom / 1.35); };
$('mAnnVis').onclick = function(){ setAnnVisible(!annVisible); closeLayer('menu'); };
$('mClear').onclick = menuThen(function(){
  if(confirm('Delete all annotations in this PDF? This cannot be undone.')){
    ann = {}; undoSt = []; redoSt = []; syncTools(); saveAnn(); pages.forEach(redrawAnn); toast('Annotations cleared');
  }
});

function openGoto(){ $('scrim').hidden = false; $('gotoModal').hidden = false; $('gotoInput').value = ''; $('gotoInput').max = N; setTimeout(function(){ $('gotoInput').focus(); }, 50); pushLayer('goto', closeGotoUI); }
function closeGotoUI(){ $('gotoModal').hidden = true; if($('menu').hidden && $('bmSheet').hidden) $('scrim').hidden = true; }
$('mGoto').onclick = menuThen(openGoto);
$('pgInd').onclick = openGoto;
$('gotoCancel').onclick = function(){ closeLayer('goto'); };
function doGoto(){
  var n = parseInt($('gotoInput').value, 10);
  if(!n || n < 1 || n > N){ toast('Enter a page from 1 to ' + N); return; }
  closeLayer('goto'); setTimeout(function(){ scrollToPage(n, 0); renderVisible(); updateIndicator(); }, 80);
}
$('gotoGo').onclick = doGoto;
$('gotoInput').addEventListener('keydown', function(e){ if(e.key === 'Enter') doGoto(); });

$('pgUp').onclick = function(){ var n = curPage(), p = pages[n - 1]; var atTop = scroller.scrollTop - p.el.offsetTop < 40; scrollToPage(atTop ? Math.max(1, n - 1) : n, 0); };
$('pgDown').onclick = function(){ scrollToPage(Math.min(N, curPage() + 1), 0); };

/* bookmarks */
function updateBookmarkUI(){
  var n = curPage(), on = bookmarks.indexOf(n) >= 0;
  $('bmLabel').textContent = on ? 'Remove bookmark' : 'Bookmark this page';
  $('bmCount').textContent = bookmarks.length;
}
$('mBm').onclick = function(){
  var n = curPage(), i = bookmarks.indexOf(n);
  if(i >= 0){ bookmarks.splice(i, 1); toast('Bookmark removed'); } else { bookmarks.push(n); bookmarks.sort(function(a, b){ return a - b; }); toast('Page ' + n + ' bookmarked'); }
  lsSet(K_BM, bookmarks); updateBookmarkUI(); closeLayer('menu');
};
function openBm(){ renderBm(); $('scrim').hidden = false; $('bmSheet').hidden = false; pushLayer('bm', closeBmUI); }
function closeBmUI(){ $('bmSheet').hidden = true; if($('menu').hidden && $('gotoModal').hidden) $('scrim').hidden = true; }
function renderBm(){
  var box = $('bmList'); box.innerHTML = '';
  if(!bookmarks.length){ box.innerHTML = '<div class="empty">No bookmarks yet. Open the menu and tap "Bookmark this page".</div>'; return; }
  bookmarks.forEach(function(n){
    var row = document.createElement('div'); row.className = 'bm';
    var go = document.createElement('button'); go.className = 'go'; go.textContent = 'Page ' + n;
    go.onclick = function(){ closeLayer('bm'); setTimeout(function(){ scrollToPage(n, 0); renderVisible(); }, 80); };
    var rm = document.createElement('button'); rm.className = 'rm'; rm.textContent = 'Remove';
    rm.onclick = function(){ bookmarks.splice(bookmarks.indexOf(n), 1); lsSet(K_BM, bookmarks); updateBookmarkUI(); renderBm(); };
    row.appendChild(go); row.appendChild(rm); box.appendChild(row);
  });
}
$('mBmList').onclick = menuThen(openBm);

boot(0);
})();
</script>
</body>
</html>
