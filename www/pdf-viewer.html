<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes">
<title>PDF</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:#0A0F1E;color:#F4F6FB;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
  .bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 14px;background:#141B33;border-bottom:1px solid rgba(255,255,255,.1);}
  .bar button{flex:none;width:38px;height:38px;border-radius:11px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#F4F6FB;font-size:20px;line-height:1;}
  .bar b{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar span{flex:none;font-size:12.5px;color:#8D97B8;}
  #pages{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0 40px;}
  canvas{background:#fff;display:block;max-width:100%;}
  .msg{text-align:center;color:#8D97B8;padding:40px 20px;font-size:14.5px;line-height:1.6;}
</style>
</head>
<body>
<div class="bar">
  <button id="back" aria-label="Back">&#8592;</button>
  <b id="ttl">PDF</b>
  <span id="pg"></span>
</div>
<div id="pages"></div>
<div class="msg" id="msg">Loading&hellip;</div>

<script src="pdfjs/pdf.min.js"></script>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var file = q.get('f');
  document.getElementById('ttl').textContent = q.get('t') || 'PDF';
  document.getElementById('back').onclick = function(){
    if(history.length > 1) history.back(); else location.href = 'index.html';
  };

  var pagesEl = document.getElementById('pages');
  var msg = document.getElementById('msg');
  var pg = document.getElementById('pg');

  if(!file || !window.pdfjsLib){
    msg.textContent = 'Could not open this file.';
    return;
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdfjs/pdf.worker.min.js';

  pdfjsLib.getDocument({ url: file }).promise.then(async function(pdf){
    var total = pdf.numPages;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var width = Math.min(window.innerWidth, 900);
    var items = [];

    for(var i = 1; i <= total; i++){
      var page = await pdf.getPage(i);
      var base = page.getViewport({ scale: 1 });
      var vp = page.getViewport({ scale: (width / base.width) * dpr });
      var c = document.createElement('canvas');
      c.width = vp.width; c.height = vp.height;
      c.style.width = (vp.width / dpr) + 'px';
      c.style.height = (vp.height / dpr) + 'px';
      c.dataset.i = i;
      pagesEl.appendChild(c);
      items.push({ page: page, vp: vp, c: c, state: 0 });
    }
    msg.style.display = 'none';
    pg.textContent = '1 / ' + total;

    // draw pages only when they are near the screen
    var drawObs = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(!en.isIntersecting) return;
        var it = items[en.target.dataset.i - 1];
        if(it.state) return;
        it.state = 1;
        it.page.render({ canvasContext: it.c.getContext('2d'), viewport: it.vp });
      });
    }, { rootMargin: '1500px 0px' });

    // show the page number that is in the middle of the screen
    var curObs = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting) pg.textContent = en.target.dataset.i + ' / ' + total;
      });
    }, { rootMargin: '-50% 0px -50% 0px' });

    items.forEach(function(it){ drawObs.observe(it.c); curObs.observe(it.c); });
  }).catch(function(err){
    msg.textContent = 'This file could not be opened. (' + (err && err.message ? err.message : err) + ')';
  });
})();
</script>
</body>
</html>
